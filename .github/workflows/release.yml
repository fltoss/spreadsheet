name: Build precompiled NIFs

on:
  push:
    tags:
      - '*'

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16"]
        job:
          - { target: aarch64-unknown-linux-gnu   , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-unknown-linux-musl  , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-apple-darwin        , os: macos-15      }
          - { target: riscv64gc-unknown-linux-gnu , os: ubuntu-22.04 , use-cross: true }
          - { target: x86_64-apple-darwin         , os: macos-15      }
          - { target: x86_64-unknown-linux-gnu    , os: ubuntu-22.04  }
          - { target: x86_64-unknown-linux-musl   , os: ubuntu-22.04 , use-cross: true }
          - { target: x86_64-pc-windows-gnu       , os: windows-2022  }
          - { target: x86_64-pc-windows-msvc      , os: windows-2022  }

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Extract project version and check the tag
      shell: bash
      run: |
        # Exactly one `@version "x.y.z"` line must exist in mix.exs.
        matches=$(grep -cE '^  @version "[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?"$' mix.exs || true)
        if [ "$matches" != "1" ]; then
          echo "::error::expected exactly one '@version \"x.y.z\"' line in mix.exs, found $matches"
          exit 1
        fi
        version=$(grep -E '^  @version "' mix.exs | cut -d'"' -f2)

        crate_version=$(grep -m1 -E '^version = "' native/spreadsheet/Cargo.toml | cut -d'"' -f2)
        if [ "$crate_version" != "$version" ]; then
          echo "::error::native/spreadsheet/Cargo.toml version $crate_version does not match mix.exs version $version"
          exit 1
        fi

        if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match mix.exs version v$version"
          exit 1
        fi

        echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        target: ${{ matrix.job.target }}

    - name: Build the project
      id: build-crate
      uses: philss/rustler-precompiled-action@v1.1.5
      with:
        project-name: spreadsheet
        project-version: ${{ env.PROJECT_VERSION }}
        target: ${{ matrix.job.target }}
        nif-version: ${{ matrix.nif }}
        use-cross: ${{ matrix.job.use-cross }}
        project-dir: "native/spreadsheet"

    - name: Artifact upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build-crate.outputs.file-name }}
        path: ${{ steps.build-crate.outputs.file-path }}

    - name: Publish archives and packages
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.build-crate.outputs.file-path }}
      if: startsWith(github.ref, 'refs/tags/')
