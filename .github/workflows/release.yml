name: Build precompiled NIFs

on:
  push:
    tags:
      - '*'

jobs:
  check_version:
    name: Check the tag matches the project version
    runs-on: ubuntu-22.04
    outputs:
      project-version: ${{ steps.versions.outputs.project-version }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - uses: erlef/setup-beam@v1
      with:
        otp-version: "28.5"
        elixir-version: "1.19.5"

    - name: Compare the tag with mix.exs and Cargo.toml
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        # Ask Mix and Cargo for the versions instead of parsing the files.
        mix_version=$(MIX_ENV=prod mix run --no-compile --no-deps-check --no-archives-check --no-start \
          --eval 'IO.puts(Mix.Project.config()[:version])' 2>/dev/null)
        cargo_version=$(cargo metadata --manifest-path native/spreadsheet/Cargo.toml \
          --no-deps --format-version 1 | jq -r '.packages[0].version')
        tag_version="${GITHUB_REF_NAME#v}"

        echo "tag: ${GITHUB_REF_NAME}, mix.exs: ${mix_version}, Cargo.toml: ${cargo_version}"

        if [ "$tag_version" != "$mix_version" ] || [ "$tag_version" != "$cargo_version" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match mix.exs (${mix_version}) and Cargo.toml (${cargo_version})"
          exit 1
        fi

        echo "project-version=${mix_version}" >> "$GITHUB_OUTPUT"

  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    needs: check_version
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16"]
        job:
          - { target: aarch64-unknown-linux-gnu   , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-unknown-linux-musl  , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-apple-darwin        , os: macos-15      }
          - { target: riscv64gc-unknown-linux-gnu , os: ubuntu-22.04 , use-cross: true }
          - { target: x86_64-apple-darwin         , os: macos-15      }
          - { target: x86_64-unknown-linux-gnu    , os: ubuntu-22.04  }
          - { target: x86_64-unknown-linux-musl   , os: ubuntu-22.04 , use-cross: true }
          - { target: x86_64-pc-windows-gnu       , os: windows-2022  }
          - { target: x86_64-pc-windows-msvc      , os: windows-2022  }

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        target: ${{ matrix.job.target }}

    - name: Build the project
      id: build-crate
      uses: philss/rustler-precompiled-action@v1.1.5
      with:
        project-name: spreadsheet
        project-version: ${{ needs.check_version.outputs.project-version }}
        target: ${{ matrix.job.target }}
        nif-version: ${{ matrix.nif }}
        use-cross: ${{ matrix.job.use-cross }}
        project-dir: "native/spreadsheet"

    - name: Artifact upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build-crate.outputs.file-name }}
        path: ${{ steps.build-crate.outputs.file-path }}

    - name: Publish archives and packages
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.build-crate.outputs.file-path }}
      if: startsWith(github.ref, 'refs/tags/')
